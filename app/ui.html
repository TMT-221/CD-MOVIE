<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovieCDStore | Quản lý cửa hàng</title>
<style>
:root{--nav:#172639;--blue:#225db2;--ink:#1c2b3d;--muted:#65748a;--line:#dce4ed;--bg:#f4f6fa;--white:#fff;--green:#14784a;--red:#b42318}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:var(--blue)}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}aside{background:var(--nav);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{font-size:21px;font-weight:750;letter-spacing:-.7px}.brand small{display:block;font-size:12px;font-weight:500;letter-spacing:.08em;color:#aebdd0;margin-top:4px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#dce5f0;border:0;text-align:left;padding:10px 12px;border-radius:7px}.nav button.active,.nav button:hover{background:#304760;color:white}.nav button[hidden]{display:none}.nav-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#aebdd0;margin:12px 0 3px 12px}.foot{font-size:12px;color:#bac8d8;margin-top:auto}.foot a{color:#d8e7ff}main{min-width:0;padding:26px 32px 48px;max-width:1500px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.top h1{font-size:25px;margin:0;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px;margin:3px 0}.identity{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.tag{display:inline-block;font-size:12px;font-weight:650;padding:5px 9px;border-radius:5px;background:#e8eef6;color:#384e6a}.card{border:1px solid var(--line);border-radius:10px;padding:20px;background:var(--white);margin:0 0 18px;box-shadow:0 2px 5px #102b4810}.card h2{font-size:18px;margin:0 0 12px}.card h3{font-size:16px;margin:0 0 10px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}.metric{margin:0;min-height:100px}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{font-size:27px;display:block;margin-top:8px}.toolbar,.fields{display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin-bottom:14px}.fields>label{flex:1;min-width:160px}label{display:grid;gap:5px;font-size:13px;font-weight:650}input,select{width:100%;min-height:39px;border:1px solid #c5d1df;border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink)}.primary,.secondary,.danger{border:1px solid transparent;padding:9px 14px;border-radius:6px;font-weight:650;white-space:nowrap}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border-color:#c5d1df;color:var(--ink)}.danger{background:#fff;color:var(--red);border-color:#e6c7c4}.table-wrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:7px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e7ecf3;white-space:nowrap}th{background:#eef3f9;position:sticky;top:0;z-index:1;font-size:12px;color:#405570}tbody tr:hover{background:#f7f9fc}tbody tr:last-child td{border-bottom:0}.num{text-align:right;font-variant-numeric:tabular-nums}.low{color:var(--red);font-weight:700}.notice{padding:11px 14px;border:1px solid #b8d8c7;background:#ecf8f1;color:#175d3d;border-radius:7px;margin-bottom:18px;overflow-wrap:anywhere}.notice.err{background:#fff1ef;border-color:#f1c6c0;color:var(--red)}.notice[hidden]{display:none}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.summary{font-size:22px;font-weight:700;margin:8px 0}.hint{font-size:13px;color:var(--muted);margin:8px 0}.step{font-size:12px;color:var(--blue);font-weight:750;text-transform:uppercase;letter-spacing:.07em}.result{background:#f2f5fa;border:1px solid var(--line);border-radius:7px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.empty{color:var(--muted);padding:20px}dialog{border:1px solid var(--line);border-radius:12px;padding:24px;width:min(420px,calc(100% - 30px));box-shadow:0 12px 45px #17263935}dialog::backdrop{background:#17263980}dialog h2{margin:0 0 12px}dialog label{margin-bottom:12px}.login-error{color:var(--red);font-size:13px;min-height:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.right{margin-left:auto}.inline{display:flex;gap:8px;align-items:center}.inline input{width:18px;min-height:18px}.mono{font-family:ui-monospace,monospace;font-size:12px}.small{font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{padding:14px;gap:8px}.nav{display:flex;flex-wrap:wrap}.nav-label,.foot{display:none}.nav button{font-size:13px;padding:7px 10px}main{padding:18px 14px}.split{grid-template-columns:1fr}.metrics{gap:7px}.metric{padding:12px}.metric strong{font-size:21px}.top{flex-wrap:wrap}}@media(max-width:450px){.metrics{grid-template-columns:1fr}.top h1{font-size:22px}.card{padding:14px}}
</style>
</head>
<body>
<div class="layout"><aside><div class="brand">MovieCDStore<small>INT1313 · LAB 02</small></div><nav class="nav" id="nav" aria-label="Điều hướng"><button data-page="home" class="active">Tổng quan</button><div class="nav-label">Danh mục</div><button data-page="movies">Phim &amp; thể loại</button><button data-page="products">Kho đĩa CD</button><div class="nav-label">Nghiệp vụ</div><button data-page="customers" data-roles="sales manager" hidden>Khách hàng</button><button data-page="employees" data-roles="manager" hidden>Nhân viên</button><button data-page="sales" data-roles="sales" hidden>Bán hàng</button><button data-page="stock" data-roles="manager" hidden>Quản lý kho</button><button data-page="revenue" data-roles="manager" hidden>Doanh thu</button></nav><div class="foot">FastAPI · MySQL 8.4<br><a href="/docs" target="_blank" rel="noopener">Swagger / OpenAPI ↗</a></div></aside><main><header class="top"><div><h1 id="title">Tổng quan</h1><p class="sub" id="subtitle">Hệ thống quản lý cửa hàng đĩa CD phim</p></div><div class="identity"><span class="tag" id="role">Khách truy cập</span><button class="secondary" id="login-open">Đăng nhập</button><button class="secondary" id="logout" hidden>Đăng xuất</button></div></header><div class="notice" id="notice" role="status" hidden></div><section id="content" aria-live="polite"></section></main></div>
<dialog id="login"><form id="login-form"><h2>Đăng nhập</h2><p class="hint">Dùng mật khẩu API trong Terminal Codespaces, không phải mật khẩu root MySQL.</p><label>Vai trò<select name="username"><option value="sales">Nhân viên bán hàng (sales)</option><option value="manager">Quản lý (manager)</option></select></label><label>Mật khẩu API<input name="password" type="password" required autocomplete="current-password"></label><p class="login-error" id="login-error" role="alert"></p><div class="actions"><button type="submit" class="primary">Đăng nhập</button><button type="button" class="secondary" id="login-close">Hủy</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);const content=$('content');let credentials=null,page='home',viewToken=0;let invoice=null;
const titles={home:'Tổng quan',movies:'Phim & thể loại',products:'Kho đĩa CD',customers:'Khách hàng',employees:'Nhân viên',sales:'Bán hàng',stock:'Quản lý kho',revenue:'Doanh thu'};
const money=n=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:2})+' ₫';
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatStock=v=>`<span class="${Number(v)<=5?'low':''}">${esc(v)}</span>`;
const headersFor=(c)=>c?{Authorization:'Basic '+btoa(c.username+':'+c.password)}:{};
async function api(path,{method='GET',body,auth=credentials}={}){const headers=headersFor(auth);if(body!==undefined)headers['Content-Type']='application/json';let res;try{res=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',credentials:'same-origin'});}catch(e){throw Error('Không kết nối được máy chủ API. Kiểm tra Codespaces và Uvicorn.');}const raw=await res.text();let data;try{data=JSON.parse(raw);}catch{data=null;}if(!res.ok){let detail=data?.detail;if(Array.isArray(detail))detail=detail.map(x=>x.loc?.join('.')+': '+x.msg).join('; ');const hints={401:'Sai mật khẩu hoặc chưa đăng nhập',403:'Không đủ quyền hoặc nhân viên không hoạt động',404:'Không tìm thấy bản ghi',409:'Xung đột dữ liệu hoặc vi phạm nghiệp vụ',422:'Dữ liệu không hợp lệ',503:'Không kết nối được CSDL'};throw Error(`HTTP ${res.status} – ${hints[res.status]||'Yêu cầu thất bại'}${detail?' ('+detail+')':''}`);}if(data===null)throw Error('Máy chủ không trả JSON. Kiểm tra URL Codespaces.');return data;}
function notice(msg,bad=false){$('notice').textContent=msg;$('notice').className='notice'+(bad?' err':'');$('notice').hidden=!msg;}
function table(rows,cols){if(!rows.length)return '<div class="empty">Không có dữ liệu phù hợp.</div>';return '<div class="table-wrap"><table><thead><tr>'+cols.map(([k,label,fmt,cls])=>`<th class="${cls||''}">${esc(label)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+cols.map(([k,label,fmt,cls])=>`<td class="${cls||''}">${fmt?fmt(row[k],row):esc(row[k])}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';}
const movieCols=[['MaPhim','Mã phim'],['TenPhim','Tên phim'],['NamPhatHanh','Năm'],['DaoDien','Đạo diễn'],['ThoiLuong','Phút']];
const productCols=[['MaDia','Mã đĩa'],['TenPhim','Tên phim'],['PhienBan','Phiên bản'],['GiaBan','Giá bán',v=>esc(money(v)),'num'],['SoLuongTon','Tồn kho',formatStock,'num']];
function card(title,html){return `<div class="card"><h2>${esc(title)}</h2>${html}</div>`;}
function options(rows,key,label){return rows.map(r=>`<option value="${esc(r[key])}">${esc(label(r))}</option>`).join('');}
function setRole(){const role=credentials?.username;$('role').textContent=role==='sales'?'Sales · Nhân viên':role==='manager'?'Manager · Quản lý':'Khách truy cập';$('login-open').hidden=!!role;$('logout').hidden=!role;document.querySelectorAll('[data-roles]').forEach(b=>b.hidden=!role||!b.dataset.roles.split(' ').includes(role));}
async function busy(btn,fn){if(btn.disabled)return;btn.disabled=true;notice('');try{await fn();}catch(e){notice(e.message,true);}finally{btn.disabled=false;}}
function wire(id,fn){$(id).addEventListener('submit',e=>{e.preventDefault();busy(e.submitter||e.target.querySelector('button[type=submit],button'),()=>fn(new FormData(e.target)));});}
function click(id,fn){$(id).addEventListener('click',e=>busy(e.currentTarget,fn));}
function isCurrent(token){return viewToken===token;}
async function navigate(next){const btn=document.querySelector(`[data-page="${next}"]`);if(!btn||btn.hidden)next='home';page=next;const token=++viewToken;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===next));$('title').textContent=titles[next];notice('');content.innerHTML='<div class="card">Đang tải dữ liệu...</div>';try{await views[next](token);}catch(e){if(isCurrent(token)){content.innerHTML='<div class="card">Không tải được dữ liệu. Chọn lại trang để thử lại.</div>';notice(e.message,true);}}}
const views={
async home(t){const [health,movies,products]=await Promise.all(['/health','/movies','/products'].map(p=>api(p,{auth:null})));if(!isCurrent(t))return;content.innerHTML=`<div class="metrics"><div class="card metric"><span>Kết nối MySQL</span><strong style="color:var(--green);font-size:23px">${health.database==='connected'?'Đã kết nối':'Chưa kết nối'}</strong></div><div class="card metric"><span>Số phim</span><strong>${movies.length}</strong></div><div class="card metric"><span>Loại đĩa CD</span><strong>${products.length}</strong></div></div>`+card('Sản phẩm cần nhập thêm',`<p class="hint">Các sản phẩm có tồn kho từ 0 đến 5.</p>${table(products.filter(r=>r.SoLuongTon<=5),productCols)}`)+card('Hướng dẫn trình diễn','<p>Khách truy cập có thể xem danh mục. Đăng nhập Sales để lập hóa đơn hoặc Manager để quản lý kho và xem doanh thu.</p><p class="hint">Giao diện sử dụng REST API của dự án, dữ liệu lấy trực tiếp từ MySQL. Có thể mở <a href="/docs" target="_blank" rel="noopener">Swagger</a> để kiểm thử từng endpoint.</p>');},
async movies(t){const rows=await api('/movies',{auth:null});if(!isCurrent(t))return;content.innerHTML=card('Danh sách phim',`<form id="search" class="toolbar"><label style="flex:1;min-width:180px">Tìm theo tên phim<input name="keyword" placeholder="Ví dụ: Avengers" maxlength="200"></label><button class="primary" type="submit">Tìm kiếm</button><button class="secondary" id="all-movies" type="button">Tất cả</button><button class="secondary" id="genres" type="button">Xem thể loại</button></form><p class="hint" id="movie-count">${rows.length} phim</p><div id="movie-table">${table(rows,movieCols)}</div>`);function show(data,cols,label){if(isCurrent(t)){$('movie-count').textContent=data.length+' '+label;$('movie-table').innerHTML=table(data,cols);}}wire('search',async f=>{const q=String(f.get('keyword')).trim();show(q?await api('/movies/search?'+new URLSearchParams({keyword:q}),{auth:null}):await api('/movies',{auth:null}),q?movieCols.slice(0,3):movieCols,'phim');});click('all-movies',async()=>show(await api('/movies',{auth:null}),movieCols,'phim'));click('genres',async()=>show(await api('/movies/genres',{auth:null}),[['MaPhim','Mã phim'],['TenPhim','Tên phim'],['TenTheLoai','Thể loại']],'liên kết phim – thể loại'));},
async products(t){const rows=await api('/products',{auth:null});if(!isCurrent(t))return;content.innerHTML=card('Danh sách đĩa CD',`<div class="toolbar"><label style="flex:1;min-width:150px">Lọc theo tên phim hoặc mã đĩa<input id="filter-product" placeholder="Tên phim hoặc mã đĩa"></label><button class="secondary" id="refresh-products">Làm mới</button></div><p class="hint">${rows.length} loại đĩa · Tồn kho ≤ 5 được đánh dấu đỏ.</p><div id="product-table">${table(rows,productCols)}</div>`);$('filter-product').oninput=e=>{const q=e.target.value.toLowerCase();$('product-table').innerHTML=table(rows.filter(r=>`${r.MaDia} ${r.TenPhim} ${r.PhienBan}`.toLowerCase().includes(q)),productCols);};click('refresh-products',()=>navigate('products'));},
async customers(t){const rows=await api('/customers');if(isCurrent(t))content.innerHTML=card('Danh sách khách hàng',`<p class="hint">${rows.length} khách hàng · Thông tin giới hạn qua VIEW.</p>${table(rows,[['MaPerson','Mã khách hàng'],['HoTen','Họ tên']])}`);},
async employees(t){const rows=await api('/employees');if(isCurrent(t))content.innerHTML=card('Danh sách nhân viên',`<p class="hint">${rows.length} nhân viên · Chỉ dành cho Manager.</p>${table(rows,[['MaPerson','Mã nhân viên'],['HoTen','Họ tên'],['LoaiNhanVien','Loại nhân viên'],['TrangThaiLamViec','Trạng thái'],['MaQuanLy','Mã quản lý']])}`);},
async sales(t){const [customers,products]=await Promise.all([api('/customers'),api('/products',{auth:null})]);if(!isCurrent(t))return;content.innerHTML=card('1. Tạo hóa đơn',`<form id="create-invoice"><div class="fields"><label>Mã hóa đơn mới<input name="MaHD" type="number" min="1" max="2147483647" step="1" required placeholder="Ví dụ: 99060"></label><label>Khách hàng<select name="MaKhachHang" required><option value="">Chọn khách hàng</option>${options(customers,'MaPerson',r=>r.MaPerson+' – '+r.HoTen)}</select></label></div><button type="submit" class="primary">Tạo hóa đơn</button></form><p class="hint">Nhân viên được xác định tự động ở máy chủ. Mỗi hóa đơn cần mã chưa sử dụng.</p><form id="resume-invoice" class="toolbar"><label style="flex:1">Hoặc mở lại hóa đơn của mình<input type="number" name="MaHD" min="1" max="2147483647" step="1" required placeholder="Mã hóa đơn đã tạo"></label><button type="submit" class="secondary">Mở hóa đơn</button></form>`)+`<div id="invoice-area"></div>`;
function renderInvoice(){const a=$('invoice-area');if(!a)return;if(!invoice){a.innerHTML='<p class="hint">Tạo hoặc mở hóa đơn để bắt đầu bán hàng.</p>';return;}const current=invoice.id;const completed=invoice.completed; a.innerHTML=card(`2. Hóa đơn #${current}`,`<p><span class="tag">${completed?'HoanTat':invoice.knownDraft?'DangTao':'Trạng thái chưa xác định'}</span></p>${completed?'':`<form id="add-item"><div class="fields"><label>Chọn đĩa CD<select name="MaDia" required><option value="">Chọn sản phẩm</option>${options(products,'MaDia',r=>r.MaDia+' – '+r.TenPhim+' / '+(r.PhienBan||'')+' – '+money(r.GiaBan))}</select></label><label>Số lượng<input name="SoLuong" type="number" min="1" step="1" max="2147483647" value="1" required></label></div><button class="primary" type="submit">Thêm vào hóa đơn</button></form>`}<p class="hint">Chi tiết vừa thêm trong phiên giao diện (không phải toàn bộ lịch sử hóa đơn).</p>${table(invoice.lines,[['MaDia','Mã đĩa'],['TenPhim','Phim'],['SoLuong','Số lượng']])}<div class="summary">Tổng tiền: ${invoice.total===null?'Chưa tính':esc(money(invoice.total))}</div><div class="actions"><button class="secondary" id="calc-total">Tính / làm mới tổng tiền</button>${completed?'':'<button class="primary" id="complete-invoice">Hoàn tất hóa đơn</button>'}</div><p class="hint">Tồn kho chỉ giảm khi hoàn tất. Tổng tiền lấy từ Function trong MySQL.</p>`);if(!completed){wire('add-item',async f=>{const pid=Number(f.get('MaDia')),qty=Number(f.get('SoLuong'));const result=await api(`/invoices/${current}/items`,{method:'POST',body:{MaDia:pid,SoLuong:qty}});if(!isCurrent(t)||invoice?.id!==current)return;invoice.knownDraft=true;invoice.lines.push({...result,TenPhim:products.find(p=>p.MaDia===pid)?.TenPhim});invoice.total=null;renderInvoice();notice('Đã thêm chi tiết hóa đơn.');});click('complete-invoice',async()=>{if(!confirm('Hoàn tất hóa đơn #'+current+' và trừ tồn kho?'))return;await api(`/invoices/${current}/complete`,{method:'POST'});if(!isCurrent(t)||invoice?.id!==current)return;invoice.completed=true;renderInvoice();notice('Hoàn tất hóa đơn thành công. Kiểm tra tồn kho tại Kho đĩa CD.');});}click('calc-total',async()=>{const result=await api(`/invoices/${current}/total`);if(!isCurrent(t)||invoice?.id!==current)return;invoice.total=result.TongTien;renderInvoice();notice('Đã tính tổng tiền từ MySQL.');});}
wire('create-invoice',async f=>{const id=Number(f.get('MaHD'));await api('/invoices',{method:'POST',body:{MaHD:id,MaKhachHang:Number(f.get('MaKhachHang'))}});if(!isCurrent(t))return;invoice={id,knownDraft:true,completed:false,lines:[],total:null};renderInvoice();notice('Tạo hóa đơn '+id+' thành công.');});wire('resume-invoice',async f=>{const id=Number(f.get('MaHD'));const result=await api(`/invoices/${id}/total`);if(!isCurrent(t))return;invoice={id,knownDraft:false,completed:false,lines:[],total:result.TongTien};renderInvoice();notice('Đã mở hóa đơn. API hiện chỉ trả tổng tiền, không trả danh sách chi tiết hoặc trạng thái khi mở lại.');});renderInvoice();},
async stock(t){const rows=await api('/products',{auth:null});if(!isCurrent(t))return;content.innerHTML=card('Cập nhật sản phẩm',`<form id="update-stock"><label>Chọn sản phẩm<select name="MaDia" id="stock-product" required><option value="">Chọn sản phẩm</option>${options(rows,'MaDia',r=>r.MaDia+' – '+r.TenPhim+' / '+(r.PhienBan||''))}</select></label><p class="hint" id="current-stock">Chọn sản phẩm để xem giá và tồn kho hiện tại.</p><div class="fields"><label>Giá bán mới (VNĐ)<input name="GiaBan" type="number" min="0.01" step="0.01" max="9999999999.99" placeholder="Bỏ trống để giữ nguyên"></label><label>Tồn kho mới<input name="SoLuongTon" type="number" min="0" step="1" max="2147483647" placeholder="Bỏ trống để giữ nguyên"></label></div><button type="submit" class="primary">Lưu thay đổi</button></form><p class="hint">Tồn kho mới là tổng số lượng sau cập nhật, không phải số lượng cộng thêm.</p>`)+card('Kho hiện tại',`<div id="stock-table">${table(rows,productCols)}</div>`);const select=$('stock-product');select.onchange=()=>{const r=rows.find(x=>x.MaDia===Number(select.value));$('current-stock').textContent=r?'Hiện tại: '+money(r.GiaBan)+' · '+r.SoLuongTon+' đĩa':'Chọn sản phẩm.';};wire('update-stock',async f=>{const pid=Number(f.get('MaDia')),body={};if(f.get('GiaBan')!=='')body.GiaBan=String(f.get('GiaBan'));if(f.get('SoLuongTon')!=='')body.SoLuongTon=Number(f.get('SoLuongTon'));if(!Object.keys(body).length)throw Error('Nhập giá bán hoặc tồn kho cần thay đổi.');if(!confirm('Cập nhật sản phẩm '+pid+'?'))return;const result=await api(`/products/${pid}`,{method:'PATCH',body});if(!isCurrent(t))return;const i=rows.findIndex(r=>r.MaDia===pid);if(i>=0)rows[i]=result;$('stock-table').innerHTML=table(rows,productCols);$('current-stock').textContent='Hiện tại: '+money(result.GiaBan)+' · '+result.SoLuongTon+' đĩa';$('update-stock').querySelector('[name=GiaBan]').value='';$('update-stock').querySelector('[name=SoLuongTon]').value='';notice('Cập nhật sản phẩm thành công.');});},
async revenue(t){const y=new Date().getFullYear();if(!isCurrent(t))return;content.innerHTML=card('Thống kê theo thời gian',`<form id="report" class="toolbar"><label>Từ ngày<input name="start_date" type="date" value="${y}-01-01" required></label><label>Đến ngày<input name="end_date" type="date" value="${y}-12-31" required></label><button type="submit" class="primary">Thống kê</button></form><p class="hint">Chỉ tính hóa đơn đã hoàn tất, theo ngày lập hóa đơn.</p>`)+`<div id="revenue-result"></div>`;async function report(f){const start=f.get('start_date'),end=f.get('end_date');if(start>end)throw Error('Từ ngày phải nhỏ hơn hoặc bằng đến ngày.');const rows=await api('/reports/revenue?'+new URLSearchParams({start_date:start,end_date:end}));if(!isCurrent(t))return;const total=rows.reduce((sum,r)=>sum+Math.round(Number(r.DoanhThu)*100),0)/100;const count=rows.reduce((sum,r)=>sum+Number(r.SoHoaDon),0);$('revenue-result').innerHTML=`<div class="metrics"><div class="card metric"><span>Tổng doanh thu</span><strong style="font-size:23px">${esc(money(total))}</strong></div><div class="card metric"><span>Hóa đơn hoàn tất</span><strong>${count}</strong></div><div class="card metric"><span>Số ngày có doanh thu</span><strong>${rows.length}</strong></div></div>`+card('Doanh thu theo ngày',table(rows,[['NgayLap','Ngày lập'],['SoHoaDon','Số hóa đơn',null,'num'],['DoanhThu','Doanh thu',v=>esc(money(v)),'num']]));}wire('report',report);await report(new FormData($('report')));}
};
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page);});$('login-open').onclick=()=>{$('login-error').textContent='';$('login').showModal();};$('login-close').onclick=()=>{$('login').close();$('login-form').reset();};$('login-form').addEventListener('submit',async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;$('login-error').textContent='';const f=new FormData(e.target),candidate={username:f.get('username'),password:f.get('password')};try{await api(candidate.username==='sales'?'/customers':'/employees',{auth:candidate});credentials=candidate;invoice=null;$('login').close();e.target.reset();setRole();await navigate('home');notice('Đăng nhập thành công.');}catch(err){$('login-error').textContent=err.message;}finally{btn.disabled=false;}});$('logout').onclick=()=>{credentials=null;invoice=null;setRole();navigate('home');};setRole();navigate('home');
</script>
